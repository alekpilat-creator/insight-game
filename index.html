<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Neuron Merge</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { margin:0; background:linear-gradient(#000, #1a0033); color:#fff; font-family:system-ui; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; overflow:hidden; position:relative; }
    h1 { font-size:2.8em; margin:20px; text-shadow:0 0 50px #a855f7; animation:glow 2s infinite alternate; }
    @keyframes glow { from { text-shadow:0 0 30px #a855f7; } to { text-shadow:0 0 60px #ec4899; } }
    .coins { font-size:3.5em; margin:20px; text-shadow:0 0 30px #ec4899; }
    .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:20px; max-width:95vw; margin:20px auto; padding:20px; background:rgba(255,255,255,0.05); border-radius:20px; }
    .neuron { width:80px; height:80px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:2.5em; font-weight:bold; box-shadow:0 0 40px currentColor; cursor:pointer; transition:all .4s cubic-bezier(0.68, -0.55, 0.27, 1.55); position:relative; }
    .neuron:active { transform:scale(1.3) rotate(10deg); }
    .level1 { background:#a855f7; color:#fff; box-shadow:0 0 40px #a855f7; }
    .level2 { background:#ec4899; color:#fff; }
    .level3 { background:#22c55e; color:#000; }
    .level4 { background:#fbbf24; color:#000; }
    .golden { background:linear-gradient(#ffd700, #ffa500); color:#000; animation:goldenGlow 1.5s infinite; box-shadow:0 0 60px #ffd700; }
    @keyframes goldenGlow { 0% { box-shadow:0 0 40px #ffd700; } 50% { box-shadow:0 0 80px #ffea00; } 100% { box-shadow:0 0 40px #ffd700; } }
    .particle { position:absolute; pointer-events:none; width:12px; height:12px; background:#ec4899; border-radius:50%; opacity:0; animation:particle 0.8s ease-out forwards; }
    .golden-particle { background:#ffd700; }
    @keyframes particle { 0% { transform:scale(0) translate(0,0); opacity:1; } 100% { transform:scale(1) translate(var(--dx), var(--dy)); opacity:0; } }
    button { background:#22c55e; color:#fff; border:none; padding:18px 36px; border-radius:40px; font-size:1.8em; margin:15px; cursor:pointer; box-shadow:0 0 40px #22c55e; transition:0.3s; }
    button:active { transform:scale(0.95); }
    .boost { background:#fbbf24; color:#000; }
    .particle-pool { position:absolute; top:0; left:0; width:0; height:0; }
  </style>
</head>
<body>
  <h1>Neuron Merge</h1>
  <div class="coins">$NEURON: <span id="coins">0</span></div>
  <div class="grid" id="grid"></div>
  <button onclick="spawnNeuron()">Spawn Neuron</button>
  <button class="boost" onclick="buyBoost()">Boost (500 Stars)</button>
  <div class="particle-pool" id="pool"></div>

  <script>
    let coins = 0;
    const grid = document.getElementById('grid');
    const pool = document.getElementById('pool');
    const cells = Array(16).fill(null);
    const particlePool = []; // Reuse particles
    let lastMergeTime = 0;
    let combo = 0;

    function updateCoins() {
      document.getElementById('coins').textContent = Math.floor(coins).toLocaleString();
    }

    function getParticle(color = '#ec4899') {
      let p = particlePool.pop() || document.createElement('div');
      p.className = 'particle ' + (color === '#ffd700' ? 'golden-particle' : '');
      p.style.background = color;
      return p;
    }

    function releaseParticle(p) {
      p.style.animation = 'none';
      p.remove();
      particlePool.push(p);
    }

    function createParticles(x, y, count = 30, color = '#ec4899') {
      for (let i = 0; i < count; i++) {
        const p = getParticle(color);
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        p.style.setProperty('--dx', (Math.random() - 0.5) * 300 + 'px');
        p.style.setProperty('--dy', (Math.random() - 0.5) * 300 + 'px');
        document.body.appendChild(p);
        setTimeout(() => releaseParticle(p), 800);
      }
    }

    function spawnNeuron(auto = false) {
      const emptyIndex = cells.findIndex(c => c === null);
      if (emptyIndex === -1) return;
      const isGolden = Math.random() < 0.05; // 5% rare golden
      const level = 1;
      const cell = document.createElement('div');
      cell.className = `neuron level${level} ${isGolden ? 'golden' : ''}`;
      cell.textContent = isGolden ? '⭐' : '🧠';
      cell.dataset.level = level;
      cell.dataset.golden = isGolden ? 'true' : 'false';
      cell.onclick = () => selectNeuron(emptyIndex);
      grid.appendChild(cell);
      cells[emptyIndex] = { level, golden: isGolden, element: cell };

      if (window.Telegram?.WebApp?.HapticFeedback) Telegram.WebApp.HapticFeedback.impactOccurred('light');
      if (!auto && isGolden) createParticles(cell.getBoundingClientRect().left + 40, cell.getBoundingClientRect().top + 40, 40, '#ffd700');
    }

    let selected = null;
    function selectNeuron(index) {
      const cell = cells[index];
      if (!cell) return;
      if (selected === null) {
        selected = index;
        cell.element.style.transform = 'scale(1.2)';
      } else if (selected !== index && cells[selected].level === cell.level && cells[selected].golden === cell.golden) {
        merge(selected, index);
        selected = null;
      } else {
        if (selected !== null) cells[selected].element.style.transform = 'scale(1)';
        selected = null;
      }
    }

    function merge(i1, i2) {
      const data1 = cells[i1];
      const newLevel = data1.level + 1;
      const multiplier = data1.golden ? 3 : 1;
      const baseCoins = newLevel * 200;
      const timeSinceLast = Date.now() - lastMergeTime;
      combo = timeSinceLast < 2000 ? combo + 1 : 1;
      const comboBonus = combo * 50;
      coins += baseCoins * multiplier + comboBonus;
      updateCoins();
      lastMergeTime = Date.now();

      const pos = data1.element.getBoundingClientRect();
      createParticles(pos.left + 40, pos.top + 40, data1.golden ? 60 : 40, data1.golden ? '#ffd700' : '#ec4899');

      // Shake + pop animation
      data1.element.style.transition = 'all 0.5s';
      data1.element.style.transform = 'scale(0) rotate(360deg)';

      grid.removeChild(data1.element);
      grid.removeChild(cells[i2].element);
      cells[i1] = null;
      cells[i2] = null;

      const empty = cells.findIndex(c => c === null);
      if (empty !== -1) {
        const cell = document.createElement('div');
        cell.className = `neuron level${newLevel} ${data1.golden ? 'golden' : ''}`;
        cell.textContent = data1.golden ? '⭐' : '🧠';
        cell.dataset.level = newLevel;
        cell.dataset.golden = data1.golden ? 'true' : 'false';
        cell.style.transform = 'scale(0)';
        cell.onclick = () => selectNeuron(empty);
        grid.appendChild(cell);
        setTimeout(() => cell.style.transform = 'scale(1)', 100);
        cells[empty] = { level: newLevel, golden: data1.golden, element: cell };
      }

      if (window.Telegram?.WebApp?.HapticFeedback) Telegram.WebApp.HapticFeedback.impactOccurred('heavy');
    }

    function buyBoost() {
      if (window.Telegram?.WebApp) Telegram.WebApp.openInvoice({title:'Boost x2', currency:'XTR', prices:[{label:'Boost', amount:500}]});
    }

    // Auto spawn (offline income vibe)
    setInterval(() => spawnNeuron(true), 10000);

    // Initial
    for (let i = 0; i < 5; i++) spawnNeuron();

    if (window.Telegram?.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }
    updateCoins();
  </script>
</body>
</html>
