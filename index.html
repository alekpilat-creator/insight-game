<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Insight Engine</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { margin:0; background:#000 url('brain.jpg') center/cover no-repeat fixed; color:#a855f7; font-family:system-ui; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; overflow:hidden; }
    .overlay { background:rgba(0,0,0,0.6); width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; }
    h1 { font-size:2.4em; margin:10px; text-shadow:0 0 30px #a855f7; }
    .coins { font-size:3em; font-weight:bold; margin:15px 0; text-shadow:0 0 20px #ec4899; }
    #bar { width:85%; max-width:400px; height:40px; background:#111; border-radius:20px; overflow:hidden; position:relative; margin:15px auto; border:1px solid #a855f7; }
    #fill { height:100%; background:linear-gradient(90deg,#a855f7,#ec4899); transition:width .5s ease; }
    #energy { position:absolute; top:0; left:50%; transform:translateX(-50%); line-height:40px; font-size:1.6em; font-weight:bold; text-shadow:0 0 10px #000; }
    #tap { width:280px; height:280px; background:rgba(168,85,247,0.2); border:3px solid #a855f7; border-radius:50%; color:#fff; font-size:4em; font-weight:bold; cursor:pointer; margin:20px auto; transition:all .2s; box-shadow:0 0 60px #a855f7; }
    #tap:active { transform:scale(0.95); box-shadow:0 0 100px #ec4899; background:rgba(236,72,153,0.3); }
    button { background:rgba(34,197,94,0.2); border:2px solid #22c55e; color:#fff; padding:15px 35px; border-radius:40px; font-size:1.4em; margin:10px; cursor:pointer; box-shadow:0 0 30px #22c55e; transition:all .2s; }
    button:active { transform:scale(0.95); background:rgba(34,197,94,0.4); }
    .boost { background:rgba(251,191,36,0.2); border:2px solid #fbbf24; box-shadow:0 0 30px #fbbf24; }
    .neuron-glow { position:absolute; width:20px; height:20px; background:#ec4899; border-radius:50%; box-shadow:0 0 30px #ec4899; opacity:0; transition:opacity 1s; pointer-events:none; }
  </style>
</head>
<body>
  <div class="overlay">
    <h1>Insight Engine</h1>
    <div class="coins"><span id="coins">0</span> $INSIGHT</div>
    <div id="bar"><div id="fill"></div><div id="energy">100 / 100</div></div>
    <button id="tap">ACTIVATE</button>
    <button class="boost" onclick="buyBoost()">Boost ×2 (500 Stars)</button>
    <button onclick="invite()">Invite Friends (+10k)</button>
  </div>

  <script>
    let coins = 0, energy = 100, max = 100;
    function update() {
      document.getElementById('coins').textContent = coins.toLocaleString();
      document.getElementById('energy').textContent = energy + ' / ' + max;
      document.getElementById('fill').style.width = (energy/max*100)+'%';
      if (window.Telegram?.WebApp?.MainButton) Telegram.WebApp.MainButton.setText(`Withdraw ${coins.toLocaleString()} $INSIGHT`);
    }
    setInterval(()=>{if(energy<max){energy+=2;update();}},1000);

    function activateNeuron() {
      const glow = document.createElement('div');
      glow.className = 'neuron-glow';
      glow.style.left = Math.random() * 90 + 'vw';
      glow.style.top = Math.random() * 90 + 'vh';
      document.body.appendChild(glow);
      glow.style.opacity = 1;
      setTimeout(() => glow.style.opacity = 0, 1000);
      setTimeout(() => glow.remove(), 2000);
    }

    function initTap() {
      const tapButton = document.getElementById('tap');
      if (tapButton) {
        tapButton.onclick = () => {
          if (energy >= 1) {
            if (window.Telegram?.WebApp?.HapticFeedback) Telegram.WebApp.HapticFeedback.impactOccurred('medium');
            coins++;
            energy--;
            activateNeuron();
            update();
            if (coins % 100 === 0) {
              if (window.Telegram?.WebApp) Telegram.WebApp.showPopup({title:'Neural Network Activated!', message:`+${coins} $INSIGHT bonus! Keep activating...`});
              else alert('Neural Network Activated! +' + coins + ' $INSIGHT bonus!');
            }
          }
        };
      }
    }

    document.addEventListener('DOMContentLoaded', initTap);

    if (window.Telegram?.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
      Telegram.WebApp.MainButton.show();
      Telegram.WebApp.MainButton.onClick(() => Telegram.WebApp.showAlert('Airdrop on TON soon – hold $INSIGHT!'));
      Telegram.WebApp.onEvent('viewportChanged', initTap);
    }
    update();
  </script>
</body>
</html>
